<!DOCTYPE html>
<html>
<head>
  <title>Créer un compte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="register">
        <h1>Rejoingnez-nous!</h1>
        <p>Inscrivez vous pour cumulez des points bonus et profiter d'avantage</p>
        <form action="Register.html" methode="POST">
            <div><br><label>Nom:</label>
                <input type="name" id="nom" name="nom" required></div>
            <div><br><label>Prenom:</label>
                <input type="name" id="prenom" name="prenom" required></div>
            <div><br><label>Date de naissance:</label>
                <input type="date" name=date></div>
            <div><br><label>Adresse:</label></div>
                <input type="text" id="adresse" name="adresse" placeholder="N°,rue,..." required>  
            <div><br><label>Adresse Email</label>
                <input type="email" id="email" name="email"  placeholder="exemple@gmail.com" required></div>
            <div><br></div><label>Mot de Passe</label>
                <input type="password" id="password" required></div>
            <br><button type="submit">S'inscrire</button>
            <br><button type="reset">Réinistialiser</button> 
            
        </form>
    </section>
</body>

</html>
